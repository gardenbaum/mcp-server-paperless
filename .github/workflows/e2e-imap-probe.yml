name: E2E mail probe (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"
jobs:
  e2e-imap-probe:
    if: github.head_ref == 'plmcp-81-2-imap'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv tool install "rust-just==${RUST_JUST_VERSION}"
      - run: uv sync --locked
      - run: just e2e-imap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-imap-container-logs
          path: e2e-imap-containers.log
