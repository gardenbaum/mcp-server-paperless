name: E2E full suite

# The whole live suite on the pinned paperless-ngx image, after every merge to main and nightly
# (decision-23). Pull requests run only a fast tier (ci.yml, job `e2e`), so this is where a
# regression it could not see turns up: a red shard fails the run, which GitHub reports on main.
# The suite is split in shards, each on its own stack (`just e2e-shard K/N`, scripts/e2e_ci.py).
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: false

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # The matrix must list every shard 1..SHARDS of scripts/e2e_ci.py (tests/quality checks it).
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A hang guard, no quality gate: a shard takes about 15 minutes on a hosted runner (about
    # 2970 s of tests in all, weighed on hosted runners in scripts/e2e_ci.py, split in four).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: just e2e-shard "$SHARD"

      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yaml logs --no-color > e2e-containers.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-container-logs-shard-${{ strategy.job-index }}
          path: e2e-containers.log
          retention-days: 7

  # Office documents and e-mails need Tika and Gotenberg: a stack of its own for the tests marked
  # office_e2e (`just e2e-office`), which the shards skip.
  e2e-office:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the Office and e-mail tests
        run: just e2e-office

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-office-container-logs
          path: e2e-office-containers.log
          retention-days: 7

  # Rejecting duplicates changes every upload: a stack of its own for the tests marked
  # duplicates_e2e (`just e2e-duplicates`), which the shards skip.
  e2e-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the tests of rejected duplicates
        run: just e2e-duplicates

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-duplicates-container-logs
          path: e2e-duplicates-containers.log
          retention-days: 7

  # PostgreSQL orders equal sort keys as it likes: a stack of its own for the tests marked
  # postgres_e2e (`just e2e-postgres`), which the shards skip.
  e2e-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the tests of the trash order
        run: just e2e-postgres

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-postgres-container-logs
          path: e2e-postgres-containers.log
          retention-days: 7
