name: E2E against latest Paperless

# Weekly and on demand (design 9.2, 9.5): the E2E suite against the highest stable paperless-ngx
# 3.x image instead of the pinned one, to catch upstream changes before the next vendored bump.
# The `resolve` job picks the release once (`just e2e-latest-version`: the `version` input, else the
# highest stable 3.x.y with a published image); then each shard of scripts/e2e_ci.py runs on its own
# stack against that release (`just e2e-latest K/N`), so one job no longer has to fit the whole
# suite in its time limit. The matrix must list every shard 1..SHARDS (tests/quality checks it).
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "paperless-ngx release to test, e.g. 3.5.1 (default: the highest stable 3.x.y)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-latest
  cancel-in-progress: false

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # An empty input resolves the latest stable 3.x tag.
      - name: Resolve the release
        id: version
        env:
          PAPERLESS_E2E_VERSION: ${{ inputs.version }}
        # A failed or empty lookup fails here, so no shard falls back to resolving on its own.
        run: |
          version="$(just e2e-latest-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e-latest:
    name: e2e-latest (${{ matrix.shard }})
    needs: resolve
    runs-on: ubuntu-latest
    # A hang guard, no quality gate: the whole suite is about 50 minutes of tests, split in four (decision-58),
    # so a shard takes about 15 minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the shard
        env:
          PAPERLESS_E2E_VERSION: ${{ needs.resolve.outputs.version }}
          SHARD: ${{ matrix.shard }}
        run: |
          test -n "$PAPERLESS_E2E_VERSION"
          just e2e-latest "$SHARD"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() || cancelled() }}
        with:
          name: e2e-latest-container-logs-shard-${{ strategy.job-index }}
          path: e2e-containers.log
          if-no-files-found: ignore
          retention-days: 7
