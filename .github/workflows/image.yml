name: Image

# Container image (decision-28, carried over by decision-40; linux/amd64 and linux/arm64).
# Separate from ci.yml and not a required check: it never slows a merge. Pull requests and main
# build, scan and smoke-test the image without pushing it. Only a pushed version tag (v*) publishes
# to GHCR, from the `publish` and `tag` jobs, the only ones allowed to write packages. Nothing
# publishes on a branch or a pull request.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .trivyignore
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/image_smoke.sh
      - scripts/image_render_smoke.sh
      - scripts/image_stdio_smoke.sh
      - .github/workflows/image.yml

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Builds the image, fails on known HIGH or CRITICAL vulnerabilities and smoke-tests it.
  build:
    # Each platform on a runner of its own: no emulation, and the smoke test runs the real thing.
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: mcp-server-paperless:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Fixed vulnerabilities only (ignore-unfixed): there is nothing to act on for the rest.
      # Reviewed exceptions go in .trivyignore, each with a reason and an expiry date.
      - name: Scan for known vulnerabilities (HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy takes linux/amd64 from an image index unless told otherwise, on any runner.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: mcp-server-paperless:ci
          scanners: vuln
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table

      - name: Smoke test (refusal without tokens, read-only, non-root, healthy, 401 and initialize)
        run: scripts/image_smoke.sh mcp-server-paperless:ci

      # For the Docker MCP Catalog, which builds it from the repository (decision-38). The same
      # filesystem as the scanned image, only other metadata; never pushed. No cache-to: it would
      # replace the cache of the full build.
      - name: Build the stdio target (loaded locally, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: stdio
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: mcp-server-paperless-stdio:ci
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The scan above covers the stdio target only while both have the same filesystem.
      - name: Require the stdio target to have exactly the scanned layers
        run: |
          http="$(docker image inspect --format '{{json .RootFS.Layers}}' mcp-server-paperless:ci)"
          stdio="$(docker image inspect --format '{{json .RootFS.Layers}}' mcp-server-paperless-stdio:ci)"
          [[ "$http" == "$stdio" ]]

      - name: Smoke test the stdio target (refusal, read-only, non-root, initialize and tools/list)
        run: scripts/image_stdio_smoke.sh mcp-server-paperless-stdio:ci

  # Version tags only: the whole live suite (e2e-full.yml) has passed on the tagged commit, else
  # nothing is published (decision-112). Dispatch it on main, wait for it, then push the tag.
  e2e:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a passed live suite on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGGED_SHA: ${{ github.sha }}
        run: |
          # Not `--status success`: with a commit GitHub's filter finds no run.
          passed="$(gh run list --workflow e2e-full.yml --commit "$TAGGED_SHA" --limit 100 --json conclusion --jq 'map(select(.conclusion == "success")) | length')"
          if [[ "$passed" -lt 1 ]]; then
            echo "::error::no passed run of e2e-full.yml on $TAGGED_SHA" >&2
            exit 1
          fi

  # Version tags only. Pushes the image under its digest alone, scans and smoke-tests exactly that
  # digest; the `tag` job gives the digests of all platforms their version tags only after each
  # passed, so what is tagged is what was scanned. Each push carries a provenance and an SBOM
  # attestation. A failed scan leaves untagged digests.
  # Recommended repository settings (not set here): a tag ruleset limiting who may create `v*`
  # tags, and a protected environment for this job.
  publish:
    needs: [build, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Each platform on a runner of its own: no emulation, and the smoke test runs the real thing.
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ancestry check below needs the history of main
          persist-credentials: false

      # A tag on a commit that never reached main (a branch, a fork's pull request) publishes nothing.
      - name: Require the tagged commit to be on main
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$TAGGED_SHA" origin/main

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 gives 1.2.3, 1.2, 1 and latest; a pre-release tag (v1.2.3-rc.1) gives only its own version.
      # OCI labels (source, revision, version, created) come from the tag and the repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # No cache-to: a tag build never writes the cache the pull request builds read.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Scan the pushed digest (HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy takes linux/amd64 from an image index unless told otherwise, on any runner.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table

      - name: Smoke test the pushed digest
        env:
          DIGEST_REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: scripts/image_smoke.sh "$DIGEST_REF"

      - name: Record the scanned digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: printf '%s' "$DIGEST" > "$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7 # a failed leg can be rerun within this time

  # Runs only when every platform was pushed, scanned and smoke-tested.
  tag:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 gives 1.2.3, 1.2, 1 and latest; a pre-release tag (v1.2.3-rc.1) gives only its own version.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # An image index of both platforms; the attestations of each digest come along.
      - name: Tag the scanned digests as one image
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$IMAGE@$digest")
          done
          mapfile -t names < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          ((${#names[@]} > 0))
          docker buildx imagetools create "${names[@]/#/--tag=}" "${refs[@]}"
