name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # Job names `check (3.14)` / `check (3.15)` and `audit` are the required status checks. The live suite runs before a release only (e2e-full.yml, decision-112).
  check:
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The gitleaks pre-commit hook is language: golang and builds with Go.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      # Building gitleaks downloads its modules from the Go servers, whose outages made `just secrets`
      # fail; the scan itself always runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # The recipes of `just check`, one step each; keep in step with the justfile.
      - run: just lock-check
      - run: just lint
      - run: just format-check
      - run: just typecheck
      - run: just imports
      - run: just deps
      - run: just secrets
      # A disk that is really full, for the tests of saved downloads (decision-45).
      - run: sudo mkdir /mnt/full-disk && sudo mount -t tmpfs -o size=8m,mode=1777 tmpfs /mnt/full-disk
      - run: just cov-diff origin/main
        env:
          PAPERLESS_MCP_FULL_DISK: /mnt/full-disk

  # The renderer's process limits have a Windows part (memory is read through kernel32): the tests
  # of rendering/ run there too, with the real child process (decision-42). Not a required check.
  rendering-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Test the renderer on Windows
        run: uv run pytest tests/rendering tests/services/test_pages.py --no-cov

      - name: Test that the server starts on Windows
        run: uv run pytest tests/test_start.py tests/test_cli.py --no-cov

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      # Building gitleaks downloads its modules from the Go servers, whose outages made `just secrets`
      # fail; the scan itself always runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-audit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Dependency audit (pip-audit with .pip-audit-ignore)
        run: just audit

      - name: Secret scan (gitleaks, whole history)
        run: just secrets
