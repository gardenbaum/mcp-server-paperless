name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # Job names `check (3.14)` / `check (3.15)` and `audit` are the required status checks; `e2e` is not (decision-23).
  check:
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The gitleaks pre-commit hook is language: golang and builds with Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # The recipes of `just check`, one step each; keep in step with the justfile.
      - run: just lock-check
      - run: just lint
      - run: just format-check
      - run: just typecheck
      - run: just imports
      - run: just deps
      - run: just secrets
      - run: just cov-diff origin/main

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Dependency audit (pip-audit with .pip-audit-ignore)
        run: just audit

      - name: Secret scan (gitleaks, whole history)
        run: just secrets

  # The fast tier of the live suite on a pull request (decision-23). Not a required check: the
  # controller waits for it before merging (doc-2). The full suite runs after the merge and nightly
  # (e2e-full.yml). The job always runs and reports; a documentation-only change skips its steps.
  # What the tier is comes from the changed paths (scripts/e2e_ci.py, tested): the live contract
  # suite, the stdio smoke test and the e2e modules of the toolsets the change touches, or the
  # whole suite for a change outside that map.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 60, not 35 (PLMCP-43): a hang guard, no quality gate; PLMCP-39 lowers it again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the pull request's base and head commits

      # The changed paths are those of the pull request's own commits (merge base to head) and of
      # the merge result against the base, so a stale base is covered. --no-renames lists both
      # sides of a rename.
      - id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$RUNNER_TEMP/changed-paths"
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed"
          git diff --name-only -z --no-renames "$BASE_SHA" HEAD >> "$changed"
          tr '\0' '\n' < "$changed" | sort -u
          python3 scripts/e2e_ci.py scope < "$changed" | tee -a "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.mode != 'skip'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - if: steps.scope.outputs.mode != 'skip'
        name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - if: steps.scope.outputs.mode != 'skip'
        name: Sync dependencies
        run: uv sync --locked

      - if: steps.scope.outputs.mode != 'skip'
        name: Run the tier
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: just e2e-paths $TARGETS

      - if: failure() && steps.scope.outputs.mode != 'skip'
        name: Collect container logs
        run: docker compose -f tests/e2e/compose.yaml logs --no-color > e2e-containers.log

      - if: failure() && steps.scope.outputs.mode != 'skip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-container-logs
          path: e2e-containers.log
          retention-days: 7
