name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # Job names `check (3.14)` / `check (3.15)` and `audit` are the required status checks; `e2e` is not (decision-24, superseded by decision-23).
  check:
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The gitleaks pre-commit hook is language: golang and builds with Go.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # The recipes of `just check`, one step each; keep in step with the justfile.
      - run: just lock-check
      - run: just lint
      - run: just format-check
      - run: just typecheck
      - run: just imports
      - run: just deps
      - run: just secrets
      # A disk that is really full, for the tests of saved downloads (decision-45).
      - run: sudo mkdir /mnt/full-disk && sudo mount -t tmpfs -o size=8m,mode=1777 tmpfs /mnt/full-disk
      - run: just cov-diff origin/main
        env:
          PAPERLESS_MCP_FULL_DISK: /mnt/full-disk

  # The renderer's process limits have a Windows part (memory is read through kernel32): the tests
  # of rendering/ run there too, with the real child process (decision-42). Not a required check.
  rendering-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Test the renderer on Windows
        run: uv run pytest tests/rendering tests/services/test_pages.py --no-cov

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Dependency audit (pip-audit with .pip-audit-ignore)
        run: just audit

      - name: Secret scan (gitleaks, whole history)
        run: just secrets

  # The fast tier of the live suite on a pull request (decision-23): the stdio smoke test and the
  # live contract and e2e modules of the toolsets the change touches, a small smoke set for a change
  # outside that map (scripts/e2e_ci.py, tested). A few minutes, never the whole suite. It is not a
  # required check (decision-24, superseded by decision-23); the controller waits for it (doc-2). The full suite runs after the
  # merge and nightly in four shards (e2e-full.yml). The job always runs and reports; a change to
  # documentation or backlog only skips its steps.
  # A heavy tier (a change across many toolsets, over 450 s of recorded test time) is split over the
  # four matrix parts; a part without work skips its steps and still reports. Nothing is dropped.
  e2e:
    name: e2e (${{ matrix.part }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ["1/4", "2/4", "3/4", "4/4"]
    # A hang guard, no quality gate: the tier takes 2 to 15 minutes. This replaces the 60 minutes of
    # PLMCP-43, which guarded the whole suite in one job; that suite now runs in e2e-full.yml.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the pull request's base and head commits
          persist-credentials: false

      # The changed paths are those of the pull request's own commits (merge base to head) and of
      # the merge result against the base, so a stale base is covered. --no-renames lists both
      # sides of a rename.
      - id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PART: ${{ matrix.part }}
        run: |
          changed="$RUNNER_TEMP/changed-paths"
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed"
          git diff --name-only -z --no-renames "$BASE_SHA" HEAD >> "$changed"
          tr '\0' '\n' < "$changed" | sort -u
          python3 scripts/e2e_ci.py scope --part "$PART" < "$changed" | tee -a "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.mode != 'skip'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - if: steps.scope.outputs.mode != 'skip'
        name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - if: steps.scope.outputs.mode != 'skip'
        name: Sync dependencies
        run: uv sync --locked

      - if: steps.scope.outputs.mode != 'skip'
        name: Run the tier
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: just e2e-paths $TARGETS

      - if: failure() && steps.scope.outputs.mode != 'skip'
        name: Collect container logs
        run: docker compose -f tests/e2e/compose.yaml logs --no-color > e2e-containers.log

      - if: failure() && steps.scope.outputs.mode != 'skip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-container-logs-part-${{ strategy.job-index }}
          path: e2e-containers.log
          retention-days: 7
