name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # Job names `check (3.14)` / `check (3.15)`, `audit` and `e2e` are the required status checks.
  check:
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The gitleaks pre-commit hook is language: golang and builds with Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # The recipes of `just check`, one step each; keep in step with the justfile.
      - run: just lock-check
      - run: just lint
      - run: just format-check
      - run: just typecheck
      - run: just imports
      - run: just deps
      - run: just secrets
      - run: just cov-diff origin/main

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Dependency audit (pip-audit with .pip-audit-ignore)
        run: just audit

      - name: Secret scan (gitleaks, whole history)
        run: just secrets

  # The required `e2e` check is three kinds of job (decision-22; logic and tests in scripts/e2e_ci.py):
  #   e2e-scope  decides whether the pull request changes anything that can affect runtime behaviour;
  #   e2e-shard  runs one part of the live suite on its own paperless-ngx stack, only when it does;
  #   e2e        always runs, and is green only when every shard succeeded or the skip applies.
  # Never put an `if` that can skip the `e2e` job itself: a skipped required check counts as passing.
  e2e-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the pull request's base and head commits

      # Pushes to main always run the whole suite. For a pull request the changed paths are those of
      # its own commits (merge base to head) and of the merge result against the base, so the
      # decision covers a stale base too. --no-renames lists both sides of a rename.
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed-paths"
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed"
          git diff --name-only -z --no-renames "$BASE_SHA" HEAD >> "$changed"
          tr '\0' '\n' < "$changed" | sort -u
          python3 scripts/e2e_ci.py scope < "$changed" | tee -a "$GITHUB_OUTPUT"

  # Real paperless-ngx 3.4.2 + Redis from tests/e2e/compose.yaml, one stack per shard; the shards
  # are `just e2e-shard K/N`, which together run what `just e2e` runs. Readiness waiting and
  # seeding live in the test session. The matrix must list every shard 1..SHARDS of
  # scripts/e2e_ci.py (tests/quality/test_e2e_ci.py checks it).
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }})
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    # TIMEOUT-COMMENT
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: just e2e-shard "$SHARD"

      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yaml logs --no-color > e2e-containers.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-container-logs-shard-${{ strategy.job-index }}
          path: e2e-containers.log
          retention-days: 7

  # The required check. `if: always()` runs it also when a shard failed, was cancelled or was
  # skipped; scripts/e2e_ci.py `verdict` then fails the job unless every shard succeeded (or the
  # scope said skip and the shards were skipped).
  e2e:
    needs: [e2e-scope, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every shard succeeded, or no runtime file changed
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.e2e-scope.result }}
          SCOPE_RUN: ${{ needs.e2e-scope.outputs.run }}
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: >-
          python3 scripts/e2e_ci.py verdict
          --scope "$SCOPE_RESULT" --run "$SCOPE_RUN" --shards "$SHARDS_RESULT"
