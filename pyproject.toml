[project]
name = "mcp-server-paperless"
version = "0.1.0"
description = "MCP server for paperless-ngx 3.x."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gardenbaum" }]
dependencies = [
    "cryptography>=50.0.2",
    "fastmcp>=4.2,<4.3",
    "httpx2>=2.16.0",
    "mcp>=2.3.0,<3",
    "py-key-value-aio>=0.5.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.40",
]

[project.urls]
Repository = "https://github.com/gardenbaum/mcp-server-paperless"
Documentation = "https://github.com/gardenbaum/mcp-server-paperless/tree/main/docs"
Issues = "https://github.com/gardenbaum/mcp-server-paperless/issues"

[project.scripts]
mcp-server-paperless = "mcp_server_paperless.cli:main"
paperless-mcp = "mcp_server_paperless.cli:main"
paperless-mcp-http = "mcp_server_paperless.cli:main_http"
mcp-server-paperless-http = "mcp_server_paperless.cli:main_http"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "basedpyright>=1.40.2",
    "coverage>=7.17.2",
    "deptry>=0.25.1",
    "diff-cover>=11.0.1",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "openapi-core>=0.23.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "syrupy>=6.1.1",
]

# --- Lint and format ---------------------------------------------------------

[tool.ruff]
line-length = 100
# Vendored third-party docs and project-management files are not our code.
extend-exclude = ["docs/vendor", ".superpowers", "backlog"]

[tool.ruff.lint]
select = ["ALL"]
# Every entry needs a reason. Suppressions in code: `# noqa: CODE -- reason` (see `just lint`).
ignore = [
    "COM812", # conflicts with `ruff format` (trailing commas are the formatter's job)
    "CPY001", # the licence lives in LICENSE; no per-file copyright headers
]

[tool.ruff.lint.per-file-ignores]
# The error names of design §5.2 (NotFound, Validation, ...) read as outcomes; an Error suffix adds nothing.
"src/mcp_server_paperless/domain/errors.py" = ["N818"]
# FastMCP evaluates tool signatures at runtime: their types must be imported, not TYPE_CHECKING-only.
"src/mcp_server_paperless/tools/*.py" = ["TC001", "TC002", "TC003"]
"scripts/**" = [
    "INP001", # standalone scripts run by path (and tested via pythonpath), not an importable package
]
"tests/**" = [
    "D1",      # test names state the behaviour; a docstring would repeat them
    "INP001",  # tests are collected by pytest (importlib mode), not imported as a package
    "PLR2004", # literal expected values are the point of a test
    "S101",    # assert is how pytest checks
    "S105",    # fake credentials are test data
    "S106",    # fake credentials are test data
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime: their imports must not move under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Mocks are banned: use a fake via constructor injection or httpx2.MockTransport."
"mock".msg = "Mocks are banned: use a fake via constructor injection or httpx2.MockTransport."
"pytest_mock".msg = "Mocks are banned: use a fake via constructor injection or httpx2.MockTransport."
"httpx".msg = "This project uses httpx2 only."

# --- Types -------------------------------------------------------------------

[tool.basedpyright]
# `recommended` enables every rule (some as warnings) and fails on warnings: stricter than
# `strict`. Fallback if FastMCP or Pydantic typing proves too noisy: `strict` + selected rules.
typeCheckingMode = "recommended"
pythonVersion = "3.14"
# Only our code; docs/vendor, .superpowers and backlog are outside this scope.
include = ["src", "tests", "scripts"]
extraPaths = ["src", "tests", "scripts"]
# `# type: ignore` silences every rule on its line in pyright; only `# pyright: ignore[rule]` counts.
enableTypeIgnoreComments = false

# --- Tests and coverage ------------------------------------------------------

[tool.pytest]
strict = true
# E2E tests need the docker compose stack (`just e2e`): `just check` deselects them.
addopts = ["--import-mode=importlib", "-ra", "-m", "not e2e", "-p", "pytester"]
testpaths = ["tests"]
# tests/e2e/helpers.py is imported as `e2e.helpers` (importlib mode adds no import path).
pythonpath = ["tests", "scripts"]
filterwarnings = [
    "error",
    # Upstream, Python 3.15 only: py-key-value-aio (a FastMCP dependency) runs beartype's import
    # hook on its own package, and beartype's isinstance() probe of the non-runtime-checkable
    # AsyncKeyValue protocol hits 3.15's new DeprecationWarning. Matches only that protocol.
    # Remove when py-key-value-aio or beartype fixes it.
    "ignore:<class 'key_value\\.aio\\.protocols\\.key_value\\.AsyncKeyValue'> isn't explicitly decorated with @runtime_checkable:DeprecationWarning",
]
markers = [
    "e2e: runs against the real Paperless stack of tests/e2e/compose.yaml (`just e2e`)",
    "ai_e2e: needs a Paperless with AI enabled and an LLM backend (`just e2e-ai`); skips otherwise",
    "decision(id): the test guards the Backlog decision with this id, e.g. \"decision-1\"",
    "contract(method): a contract test of this port method, e.g. \"InstanceReader.get_overview\"",
]

[tool.coverage.run]
branch = true
# scripts/ holds the helpers of the scheduled quality jobs: tested like the product code.
source = ["src/mcp_server_paperless", "scripts"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
# The only coverage exclusions: reviewed patterns for lines that never run by design. Inline
# `# pragma` comments are banned (`just hygiene`); add a pattern here when a real need exists.
exclude_also = [
    "if TYPE_CHECKING:",    # imports for annotations only
    "^\\s*\\.\\.\\.$",      # bodies of Protocol methods and overloads
    "^if __name__ == \"__main__\":", # script entry points; main() takes its streams as arguments
]

# --- Mutation testing (design 9.2; weekly and on demand: `just mutation`) -----

[tool.mutmut]
# Only the two packages whose logic the unit and adapter tests must pin down.
source_paths = ["src/mcp_server_paperless/services", "src/mcp_server_paperless/paperless"]
# mutmut copies src/ and tests/ into mutants/ and runs pytest there; the `e2e` marker stays
# deselected through addopts (`-m "not e2e"`), so no Paperless stack is needed. Coverage adds
# nothing to a mutation run.
# The rest of the package (domain/, settings, ...) is imported by the code under mutation.
also_copy = ["src/", "scripts/", "docs/vendor/paperless/", "backlog/decisions/"]
# tests/quality tests the job scripts, not the code under mutation.
pytest_add_cli_args = ["--no-cov", "--ignore=tests/quality"]
pytest_add_cli_args_test_selection = ["tests"]

# --- Architecture (design §5.1) ----------------------------------------------

[tool.importlinter]
root_package = "mcp_server_paperless"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints > server > observability > settings > tools | paperless > services > domain"
type = "layers"
containers = ["mcp_server_paperless"]
# Every module below the package root must be placed in a layer, so nothing in the layers imports
# the entrypoints. The root itself (`__init__.py`) is the container: its own contract follows.
exhaustive = true
layers = [
    "__main__ : app : cli",
    "server",
    "observability",
    "settings",
    "tools | paperless",
    "services",
    "domain",
]

[[tool.importlinter.contracts]]
name = "The package root imports nothing from the package and no I/O or MCP library"
type = "forbidden"
source_modules = ["mcp_server_paperless"]
as_packages = false
forbidden_modules = ["mcp_server_paperless.**", "httpx2", "fastmcp", "mcp", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "The adapter does not use services"
type = "forbidden"
source_modules = ["mcp_server_paperless.paperless"]
forbidden_modules = ["mcp_server_paperless.services"]

[[tool.importlinter.contracts]]
name = "Only the composition root imports tools and paperless"
type = "forbidden"
source_modules = [
    "mcp_server_paperless.__main__",
    "mcp_server_paperless.app",
    "mcp_server_paperless.cli",
    "mcp_server_paperless.settings",
]
forbidden_modules = ["mcp_server_paperless.tools", "mcp_server_paperless.paperless"]
# Entrypoints reach tools and paperless through server.py; only direct imports are wrong.
allow_indirect_imports = true

# The external-package rules below check direct imports only. That is complete because every
# module is either in a layer or the package root (which imports nothing from the package, see
# above): an indirect path to a forbidden package ends in a direct import that one of these
# contracts reports, and the layers block paths through the modules that may import it.
# (`protected` contracts would be simpler but fail while a package is not imported yet.)
# A module added to the layers joins the source lists below that apply to it.

[[tool.importlinter.contracts]]
name = "Only paperless imports httpx2"
type = "forbidden"
source_modules = [
    "mcp_server_paperless.__main__",
    "mcp_server_paperless.app",
    "mcp_server_paperless.cli",
    "mcp_server_paperless.server",
    "mcp_server_paperless.observability",
    "mcp_server_paperless.settings",
    "mcp_server_paperless.tools",
    "mcp_server_paperless.services",
    "mcp_server_paperless.domain",
]
forbidden_modules = ["httpx2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# observability may import fastmcp too: its CallLogging is FastMCP middleware, and it sits
# above settings and below server in the layers, outside the source list below.
name = "Only tools, observability, server and entrypoints import fastmcp and mcp"
type = "forbidden"
source_modules = [
    "mcp_server_paperless.settings",
    "mcp_server_paperless.paperless",
    "mcp_server_paperless.services",
    "mcp_server_paperless.domain",
]
forbidden_modules = ["fastmcp", "mcp"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No pydantic-settings below the composition root (configuration is injected)"
type = "forbidden"
source_modules = [
    "mcp_server_paperless.tools",
    "mcp_server_paperless.paperless",
    "mcp_server_paperless.services",
    "mcp_server_paperless.domain",
]
forbidden_modules = ["pydantic_settings"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No httpx"
type = "forbidden"
source_modules = ["mcp_server_paperless"]
forbidden_modules = ["httpx"]

# Toolset independence (design §5.1, decision-1): toolset modules in tools/ do not import each
# other; what they share lives in tools/_shared. A toolset's stdio variant imports its own
# toolset's module (the shared description and parameter types), which is why those two edges are
# ignored. Add every new toolset module here.
[[tool.importlinter.contracts]]
name = "Toolset modules do not import each other"
type = "independence"
modules = [
    "mcp_server_paperless.tools.core",
    "mcp_server_paperless.tools.ai",
    "mcp_server_paperless.tools.bulk",
    "mcp_server_paperless.tools.mail",
    "mcp_server_paperless.tools.prompts",
    "mcp_server_paperless.tools.sharing",
    "mcp_server_paperless.tools.upload",
    "mcp_server_paperless.tools.upload_stdio",
    "mcp_server_paperless.tools.versions",
    "mcp_server_paperless.tools.versions_stdio",
    "mcp_server_paperless.tools.views",
    "mcp_server_paperless.tools.workflows",
    "mcp_server_paperless.tools.trash",
    "mcp_server_paperless.tools.pdf",
    "mcp_server_paperless.tools.permissions",
]
ignore_imports = [
    "mcp_server_paperless.tools.upload_stdio -> mcp_server_paperless.tools.upload",
    "mcp_server_paperless.tools.versions_stdio -> mcp_server_paperless.tools.versions",
]
