# [[open]]        operations no tool covers, each under a Backlog task that is not done
# [[open_fields]] query parameters, body fields and enum values of covered operations that no
#                 tool sends. A field under an unsent parent is not listed on its own. A listed
#                 value of a field that is sent carries a `reason`, so that the owner can decide on
#                 an exclusion. A field a tool supports that no tool test sends is listed too.
# [[internal]]    fields the adapter chooses itself although a tool causes the request: fixed
#                 constants (ordering, a projection, full_perms, owner), a filter the adapter
#                 adds, and the stored object it sends back (the body of mail_accounts/test and
#                 /process/, document_ids of a bundle rebuild). No argument of any tool can set
#                 them, so they stay open although they are sent. A value or id a tool argument
#                 decides (id__in, task_type) is not internal.
# [[exclusion]]   an owner-approved exclusion: quote, date and a Markdown file under backlog/
# [[undeclared]]  query parameters the generated schema omits (listed by hand)

