# Hand-written part of the Paperless API coverage (PLMCP-91). See api-coverage.md, the
# generated table, and tests/quality/test_api_coverage.py, which checks this file.
#
# [[open]]        operations no tool covers, each under a Backlog task that is not done
# [[open_fields]] query parameters, body fields and enum values of covered operations that no
#                 tool sends. A field under an unsent parent is not listed on its own. A listed
#                 value of a field that is sent carries a `reason`, so that the owner can decide on
#                 an exclusion. A field a tool supports that no tool test sends is listed too.
# [[internal]]    fields the adapter chooses itself although a task wants them as a tool argument
#                 (tasks owner, ordering, date_created_after; the body of mail_accounts/test, for
#                 testing an unsaved account; the documents of a bundle rebuild, PLMCP-83). They
#                 stay open under that task although they are sent.
# [[plumbing]]    fields the adapter chooses itself and no task is known to want as an argument
#                 (applied where it was noticed, not a census of every constant): full_perms,
#                 projections, constants of helpers that read every page, the stored object sent
#                 back. No feature, no open work; shown apart, checked against the schema. A value
#                 or id a tool argument decides (id__in, task_type) is neither.
#                 What hangs under a plumbing field and is sent by no tool is a problem, unless it
#                 is a value (full_perms=false, a value of the stored object that no scenario
#                 holds) and the row names it as `name=value`. A child field cannot be named
#                 away: a tool sends it, or its parent is no plumbing.
# [[exclusion]]   an owner-approved exclusion: quote, date and a Markdown file under backlog/
#                 (an excluded value of a field that is sent also needs a `reason`)
# [[undeclared]]  query parameters the generated schema omits (listed by hand)

